<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타로 카드 리딩</title>
<style>
  :root {
    --bg: #f5f1fb;
    --card: #ffffff;
    --text: #231f33;
    --muted: #6b6880;
    --accent: #7c3aed;
    --border: #e4def0;
    --back1: #5b21b6;
    --back2: #7c3aed;
    --face: #fffaf0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #120d24;
      --card: #1c1636;
      --text: #f1edfa;
      --muted: #a69fc4;
      --accent: #a78bfa;
      --border: #342b5a;
      --back1: #2e1065;
      --back2: #6d28d9;
      --face: #2a2248;
    }
  }
  :root[data-theme="dark"] {
    --bg: #120d24;
    --card: #1c1636;
    --text: #f1edfa;
    --muted: #a69fc4;
    --accent: #a78bfa;
    --border: #342b5a;
    --back1: #2e1065;
    --back2: #6d28d9;
    --face: #2a2248;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    padding: 32px 16px 48px;
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { text-align: center; margin: 0 0 4px; }
  h1.title { font-family: Georgia, "Batang", "Noto Serif KR", serif; letter-spacing: .2em; font-weight: 600; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .theme-toggle {
    position: fixed; top: 12px; right: 12px; cursor: pointer; font-size: 14px;
  }
  select, button, input {
    font: inherit;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 10px 14px;
    background: var(--card);
    color: var(--text);
  }
  button { cursor: pointer; }
  button.primary {
    background: var(--accent); color: #fff; border-color: var(--accent); font-weight: bold;
  }
  button.primary:hover { filter: brightness(1.1); }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .controls input { flex: 1 1 260px; min-width: 0; }

  .table { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 8px 0; }
  .slot { width: 180px; text-align: center; }
  .slot-title {
    font-family: Georgia, "Batang", serif; letter-spacing: .15em;
    font-size: 13px; color: var(--muted); margin-bottom: 10px; min-height: 18px;
  }
  .flip { perspective: 1000px; width: 180px; height: 300px; cursor: pointer; }
  .flip:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 12px; }
  .flip-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .8s;
    transform-style: preserve-3d;
  }
  .flip.open .flip-inner { transform: rotateY(180deg); }
  .flip:not(.open):hover .flip-inner { transform: translateY(-4px); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 10px;
    border: 3px solid #b8892b;
    box-shadow: 0 8px 20px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.4);
    overflow: hidden;
  }
  .face::before {
    content: ""; position: absolute; inset: 7px;
    border: 1.5px solid #b8892b; border-radius: 4px; pointer-events: none;
  }
  /* 카드 뒷면: 남색 바탕에 금빛 문양 */
  .back {
    background:
      radial-gradient(circle at center, #1d1a52 0 38%, transparent 39%),
      repeating-linear-gradient(45deg, #14123a 0 9px, #1b1850 9px 18px);
    display: flex; align-items: center; justify-content: center;
  }
  .back::after {
    content: "º6"; color: #d9b24c; font-size: 46px;
    width: 96px; height: 96px; border: 2px solid #b8892b; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 5px #14123a, 0 0 0 6px #b8892b;
  }
  /* 카드 앞면: 양피지 질감 + 로마 숫자 + 메달리온 + 이름 띠 */
  .front {
    transform: rotateY(180deg);
    background: radial-gradient(circle at 50% 40%, #f6ebcb, #e8d6a6);
    color: #3b2a0d;
    font-family: Georgia, "Batang", "Noto Serif KR", serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 12px 12px;
  }
  .front .num { font-size: 15px; letter-spacing: .2em; font-weight: bold; margin-top: 2px; }
  .front .medal {
    width: 112px; height: 112px; margin: 10px 0 12px; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, #2b2670, #14123a);
    border: 3px solid #b8892b;
    box-shadow: 0 0 0 4px #e8d6a6, 0 0 0 5px #b8892b;
    display: flex; align-items: center; justify-content: center;
  }
  .front .sym {
    font-family: "Segoe UI Symbol", "Noto Sans Symbols", "Apple Symbols", serif;
    font-size: 62px; line-height: 1; color: #e2bd5b;
    text-shadow: 0 0 8px rgba(226,189,91,.45);
    transition: transform .4s;
  }
  .front .medal.rev .sym { transform: rotate(180deg); }
  .front .name { font-weight: bold; font-size: 17px; margin-top: auto; }
  .front .en { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-top: 3px; color: #6b4a14; }
  .front .dir {
    margin-top: 8px; font-size: 11px; padding: 2px 10px; border-radius: 20px;
    background: #3b2a0d; color: #e8d6a6; letter-spacing: .1em;
  }

  .reading { display: grid; gap: 12px; }
  .reading h3 { margin: 0 0 4px; font-size: 16px; }
  .reading p { margin: 6px 0; line-height: 1.65; }
  .reading strong { color: var(--accent); }
  .reading .tip { background: var(--bg); border-radius: 10px; padding: 8px 12px; }
  .kw { color: var(--accent); font-weight: bold; font-size: 14px; }
  .q { text-align: center; font-style: italic; color: var(--muted); margin: 0 0 8px; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; }
  .empty { text-align: center; color: var(--muted); padding: 12px 0; }
</style>
</head>
<body>
<button id="theme" class="theme-toggle" type="button" aria-label="테마 전환"></button>
<main>
  <h1 class="title">타로 카드 리딩</h1>
  <p class="sub">마음속 질문을 떠올리고 카드를 뽑아보세요</p>

  <div class="panel controls">
    <input id="question" type="text" maxlength="80" placeholder="질문을 적어보세요 (선택)">
    <select id="topic" aria-label="질문 주제">
      <option value="all" selected>주제: 종합</option>
      <option value="love">주제: 연애</option>
      <option value="work">주제: 직업·학업</option>
      <option value="money">주제: 재물</option>
    </select>
    <select id="spread">
      <option value="1">원 카드 (오늘의 카드)</option>
      <option value="3" selected>쓰리 카드 (과거·현재·미래)</option>
    </select>
    <button id="draw" class="primary">카드 뽑기</button>
  </div>

  <div class="panel">
    <div id="question-echo" class="q" hidden></div>
    <div id="table" class="table"></div>
    <div class="empty" id="table-hint">‘카드 뽑기’를 누른 뒤, 카드를 눌러 뒤집어 보세요.</div>
  </div>

  <div class="panel reading" id="reading" hidden></div>

  <p class="hint">타로는 재미와 자기 성찰을 위한 놀이입니다. 중요한 결정은 스스로 신중하게 내려주세요.</p>
</main>

        money: '목표 금액에 거의 도달했지만 마무리가 부족합니다. 마지막 계획을 점검하세요.',

  // 전통 점성술 기호(황금새벽회 대응)를 카드 중앙 문양으로 사용
  const SYMBOLS = ['♅︎', '☿︎', '☽︎', '♀︎', '♈︎', '♉︎', '♊︎', '♋︎', '♌︎', '♍︎', '♃︎', '♎︎', '♆︎', '♏︎', '♐︎', '♑︎', '♂︎', '♒︎', '♓︎', '☉︎', '♇︎', '♄︎'];
  const ROMAN = ['0','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];

  const POSITIONS = {
    1: ['오늘의 메시지'],
    3: ['과거', '현재', '미래']
  };

  const tableEl = document.getElementById('table');
  const hintEl = document.getElementById('table-hint');
  const readingEl = document.getElementById('reading');
  const echoEl = document.getElementById('question-echo');
  let drawn = [];
  let opened = 0;

  function randInt(max) {
    const limit = Math.floor(0x100000000 / max) * max;
    const buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % max;
  }

  function pickCards(count) {
    const pool = CARDS.slice();
    const out = [];
    for (let i = 0; i < count; i++) {
      const card = pool.splice(randInt(pool.length), 1)[0];
      out.push({ card, reversed: randInt(2) === 1 });
    }
    return out;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function buildSlot(item, title, index, total) {
    const slot = el('div', 'slot');
    slot.appendChild(el('div', 'slot-title', title));

    const flip = el('div', 'flip');
    flip.tabIndex = 0;
    flip.setAttribute('role', 'button');
    flip.setAttribute('aria-label', title + ' 카드 뒤집기');
    const inner = el('div', 'flip-inner');

    const back = el('div', 'face back');
    const front = el('div', 'face front');
    front.appendChild(el('div', 'num', ROMAN[item.card.n]));
    const medal = el('div', 'medal' + (item.reversed ? ' rev' : ''));
    medal.appendChild(el('div', 'sym', SYMBOLS[item.card.n]));
    front.appendChild(medal);
    front.appendChild(el('div', 'name', item.card.name));
    front.appendChild(el('div', 'en', item.card.en));
    front.appendChild(el('div', 'dir', item.reversed ? '역방향' : '정방향'));

    inner.appendChild(back);
    inner.appendChild(front);
    flip.appendChild(inner);
    slot.appendChild(flip);

    const open = () => {
      if (flip.classList.contains('open')) return;
      flip.classList.add('open');
      opened++;
      if (opened === total) showReading();
    };
    flip.addEventListener('click', open);
    flip.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
    return slot;
  }

  const TOPICS = { love: '연애', work: '직업·학업', money: '재물' };
  let topic = 'all';

  function labeled(label, text, cls) {
    const p = el('p', cls || '');
    p.appendChild(el('strong', '', label + ' '));
    p.appendChild(document.createTextNode(text));
    return p;
  }

  function showReading() {
    readingEl.innerHTML = '';
    const titles = POSITIONS[drawn.length];
    const faceOf = item => (item.reversed ? item.card.rev : item.card.up);
    drawn.forEach((item, i) => {
      const { card, reversed } = item;
      const face = faceOf(item);
      const box = el('div');
      box.appendChild(el('h3', '', titles[i] + ' · ' + card.name + (reversed ? ' (역방향)' : '')));
      box.appendChild(el('div', 'kw', face.kw.map(k => '#' + k).join(' ')));
      box.appendChild(el('p', '', face.t));
      const keys = topic === 'all' ? ['love', 'work', 'money'] : [topic];
      keys.forEach(k => box.appendChild(labeled(TOPICS[k], face[k])));
      box.appendChild(labeled('오늘의 조언', face.tip, 'tip'));
      readingEl.appendChild(box);
    });
    if (drawn.length === 3) {
      const sum = el('div');
      sum.appendChild(el('h3', '', '종합 흐름'));
      sum.appendChild(el('p', '',
        '과거의 「' + drawn[0].card.name + '」에서 현재의 「' + drawn[1].card.name +
        '」을 거쳐 「' + drawn[2].card.name + '」의 흐름으로 이어집니다.'));
      const future = faceOf(drawn[2]);
      if (topic === 'all') sum.appendChild(labeled('앞으로의 방향', future.t));
      else sum.appendChild(labeled(TOPICS[topic] + '의 앞날', future[topic]));
      sum.appendChild(labeled('지금 할 일', faceOf(drawn[1]).tip, 'tip'));
      readingEl.appendChild(sum);
    }
    readingEl.hidden = false;
    readingEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.getElementById('draw').addEventListener('click', () => {
    const count = parseInt(document.getElementById('spread').value, 10);
    const question = document.getElementById('question').value.trim();
    topic = document.getElementById('topic').value;
    drawn = pickCards(count);
    opened = 0;
    tableEl.innerHTML = '';
    readingEl.hidden = true;
    hintEl.textContent = '카드를 눌러 한 장씩 뒤집어 보세요.';
    echoEl.hidden = !question;
    echoEl.textContent = question ? '“' + question + '”' : '';
    const titles = POSITIONS[count];
    drawn.forEach((item, i) => tableEl.appendChild(buildSlot(item, titles[i], i, count)));
  });

  // 테마 전환 (라이트/다크), 선택값은 localStorage에 저장
  const themeBtn = document.getElementById('theme');
  const root = document.documentElement;
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  function currentTheme() {
    return root.dataset.theme || (darkQuery.matches ? 'dark' : 'light');
  }
  function updateThemeBtn() {
    themeBtn.textContent = currentTheme() === 'dark' ? '☀️ 화이트 모드' : '🌙 다크 모드';
  }
  try {
    const saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') root.dataset.theme = saved;
  } catch (e) {}
  themeBtn.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    updateThemeBtn();
  });
  darkQuery.addEventListener('change', updateThemeBtn);
  updateThemeBtn();
</script>
