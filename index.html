<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로또 번호 추첨기</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #4f46e5;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #818cf8;
      --border: #334155;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  main {
    width: 100%;
    max-width: 560px;
  }
  h1 { text-align: center; margin: 0 0 4px; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
  }
  select, button {
    font: inherit;
    border-radius: 10px;
    border: 1px solid var(--border);
    padding: 10px 14px;
    background: var(--card);
    color: var(--text);
  }
  button.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: bold;
    cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.1); }
  button.ghost { cursor: pointer; }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .row:last-child { border-bottom: none; }
  .label { width: 24px; color: var(--muted); font-weight: bold; }
  .ball {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    box-shadow: inset 0 -3px 6px rgba(0,0,0,.2);
    animation: pop .35s ease backwards;
  }
  @keyframes pop {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .b1 { background: #f5b800; }
  .b2 { background: #3b82f6; }
  .b3 { background: #ef4444; }
  .b4 { background: #6b7280; }
  .b5 { background: #22c55e; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  .history h2 { font-size: 16px; margin: 0 0 8px; }
  .history ul { list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--muted); }
  .history li { padding: 6px 0; border-bottom: 1px dashed var(--border); }
  .history li:last-child { border-bottom: none; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>🎱 로또 번호 추첨기</h1>
  <p class="sub">1~45 중 서로 다른 6개의 번호를 무작위로 뽑아드립니다</p>

  <div class="card controls">
    <label for="count">게임 수</label>
    <select id="count">
      <option value="1">1게임</option>
      <option value="2">2게임</option>
      <option value="3">3게임</option>
      <option value="4">4게임</option>
      <option value="5" selected>5게임</option>
    </select>
    <button id="draw" class="primary">번호 추첨</button>
    <button id="clear" class="ghost">기록 지우기</button>
  </div>

  <div class="card" id="result" aria-live="polite">
    <div class="empty">‘번호 추첨’ 버튼을 눌러보세요!</div>
  </div>

  <div class="card history" id="historyCard" hidden>
    <h2>지난 추첨 기록</h2>
    <ul id="history"></ul>
  </div>

  <p class="hint">재미로만 즐기세요. 실제 당첨 확률과는 무관합니다.</p>
</main>

<script>
  const resultEl = document.getElementById('result');
  const historyEl = document.getElementById('history');
  const historyCard = document.getElementById('historyCard');
  const countEl = document.getElementById('count');
  const LABELS = ['A', 'B', 'C', 'D', 'E'];
  let history = [];

  // 암호학적으로 안전한 난수로 0 이상 max 미만의 정수를 생성
  function randInt(max) {
    const limit = Math.floor(0x100000000 / max) * max;
    const buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % max;
  }

  function drawGame() {
    const pool = Array.from({ length: 45 }, (_, i) => i + 1);
    const picked = [];
    for (let i = 0; i < 6; i++) {
      picked.push(pool.splice(randInt(pool.length), 1)[0]);
    }
    return picked.sort((a, b) => a - b);
  }

  function ballClass(n) {
    if (n <= 10) return 'b1';
    if (n <= 20) return 'b2';
    if (n <= 30) return 'b3';
    if (n <= 40) return 'b4';
    return 'b5';
  }

  function render(games) {
    resultEl.innerHTML = '';
    games.forEach((nums, g) => {
      const row = document.createElement('div');
      row.className = 'row';
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = LABELS[g];
      row.appendChild(label);
      nums.forEach((n, i) => {
        const ball = document.createElement('div');
        ball.className = 'ball ' + ballClass(n);
        ball.textContent = n;
        ball.style.animationDelay = (g * 6 + i) * 60 + 'ms';
        row.appendChild(ball);
      });
      resultEl.appendChild(row);
    });
  }

  function renderHistory() {
    historyCard.hidden = history.length === 0;
    historyEl.innerHTML = '';
    history.forEach(entry => {
      const li = document.createElement('li');
      li.textContent = entry.time + ' — ' + entry.games.map(g => g.join(', ')).join(' | ');
      historyEl.appendChild(li);
    });
  }

  document.getElementById('draw').addEventListener('click', () => {
    const n = parseInt(countEl.value, 10);
    const games = Array.from({ length: n }, drawGame);
    render(games);
    history.unshift({ time: new Date().toLocaleTimeString('ko-KR'), games });
    history = history.slice(0, 10);
    renderHistory();
  });

  document.getElementById('clear').addEventListener('click', () => {
    history = [];
    renderHistory();
    resultEl.innerHTML = '<div class="empty">‘번호 추첨’ 버튼을 눌러보세요!</div>';
  });
</script>
</body>
</html>
